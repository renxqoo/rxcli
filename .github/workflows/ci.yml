# CI —— 跨平台(ubuntu/macos/windows)× Node(20/22)矩阵
# 编排关键:apps 依赖 cli-sdk 的 dist 编译产物,故必须先 build 再 typecheck/test。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同分支新 push 取消旧的,省 CI 额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # version changelog gate —— 版本 PR 必须有对应的正式 changelog 条目
  # ---------------------------------------------------------------------------
  changelog:
    name: Version changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/check-version-changelog.mjs "${{ github.event.pull_request.base.sha }}"

  # ---------------------------------------------------------------------------
  # lint —— 单 job(oxlint 极快,无需矩阵),typecheck+test 前先跑
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  # ---------------------------------------------------------------------------
  # build + typecheck + test —— 3 平台 × 2 Node 版本矩阵
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.os }} / node-${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 一个 job 失败不取消其余(看全平台结果)
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 关键:先 build(拓扑序 cli-sdk → apps),生成 cli-sdk/dist 供 apps 引用
      - run: pnpm -r run build

      - run: pnpm -r run typecheck

      - run: pnpm -r run test

  package-quality:
    name: Package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @renxqoo/agent-data-cli test:package

      - run: pnpm --filter @renxqoo/agent-data-cli test:coverage

      - run: pnpm docs:check

      - run: pnpm dlx publint@0.3.23 packages/cli-sdk --strict

      - run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack packages/cli-sdk --profile esm-only
