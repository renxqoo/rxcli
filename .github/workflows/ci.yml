# CI —— 跨平台(ubuntu/macos/windows)× Node(18/20/22)矩阵
# 编排关键:apps 依赖 cli-sdk 的 dist 编译产物,故必须先 build 再 typecheck/test。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同分支新 push 取消旧的,省 CI 额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # lint —— 单 job(oxlint 极快,无需矩阵),typecheck+test 前先跑
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  # ---------------------------------------------------------------------------
  # build + typecheck + test —— 3 平台 × 3 Node 版本矩阵
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.os }} / node-${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 一个 job 失败不取消其余(看全平台结果)
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 关键:先 build(拓扑序 cli-sdk → apps),生成 cli-sdk/dist 供 apps 引用
      - run: pnpm -r run build

      - run: pnpm -r run typecheck

      - run: pnpm -r run test
